<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="MAO architecture: Model, Action, Orchestration, with a hash-chained audit log."><rect width="1280" height="620" fill="#0A0A0B"/><text x="60" y="52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="5" fill="#C9A96E">THE MAO FRAMEWORK  ·  REFERENCE ARCHITECTURE</text><text x="60" y="92" font-family="Georgia, 'Times New Roman', Times, serif" font-size="34" font-style="italic" fill="#ECE7DB">Three layers. One chain of evidence.</text><rect x="60" y="130" width="1160" height="96" fill="#111114" stroke="#C9A96E" stroke-opacity="0.45"/><text x="88" y="170" font-family="Georgia, 'Times New Roman', Times, serif" font-size="30" fill="#ECE7DB">Model</text><text x="88" y="198" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#C9A96E">WHICH INTELLIGENCE, AT WHAT COST OF BEING WRONG</text><rect x="660" y="160" width="120" height="36" fill="none" stroke="#C9A96E" stroke-opacity="0.7"/><text x="677" y="183" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#E7D3A7">capability</text><rect x="792" y="160" width="68" height="36" fill="none" stroke="#C9A96E" stroke-opacity="0.7"/><text x="809" y="183" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#E7D3A7">cost</text><rect x="872" y="160" width="94" height="36" fill="none" stroke="#C9A96E" stroke-opacity="0.7"/><text x="889" y="183" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#E7D3A7">latency</text><rect x="979" y="160" width="111" height="36" fill="none" stroke="#C9A96E" stroke-opacity="0.7"/><text x="996" y="183" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#E7D3A7">risk tier</text><rect x="60" y="246" width="1160" height="96" fill="#111114" stroke="#C9A96E" stroke-opacity="0.45"/><text x="88" y="286" font-family="Georgia, 'Ti